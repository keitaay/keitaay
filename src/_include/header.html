<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% favicons 'src/favicon.svg' %}

<!--
    SEO/social preview metadata. `description` and `imageHero` come from
    each page's own front matter where set (case studies already have both);
    pages without one fall back to `site.defaultDescription` as defined in
    `.eleventy.js`. Pages without `imageHero` simply omit the field `og:image/twitter:image`, and do not point at a placeholder. `og:url/canonical`
    are fully derived using existing data.
-->
<meta name="description" content="{{ description or summary or site.defaultDescription }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description or summary or site.defaultDescription }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
{% if imageHero %}
<meta property="og:image" content="{{ site.url }}{{ imageHero | url }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">

<!--
    Person schema (JSON-LD), site-wide, for search/AI-citation authority signals.
    Note: no "image" property yet - add one once a real headshot exists (see
    Content backlog in src/README.md), rather than pointing it at a placeholder.
-->
<script type="application/ld+json">
{% include "person.json" %}
</script>

<!--font-->
<link rel="preconnect" href="https://fonts.googleapis.com/" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..800&display=swap&family=Noto+Serif+Display:wght@100..800&display=swap">
<!--also see for sans serif: Leon Sans (fontsarena.com/leon-sans-by-jongmin-kim/)-->
<!--for serif fonts: consider: Petrona, EB Garamond, Lora-->

<!--set active page for navbar modification-->

<!--define style for pre-loaded content; used while rest of page is being loaded-->
<style type="text/css">
    html {
        scroll-behavior: smooth
    }

    body {
        margin: 0;
        padding: 0;
        background-color: #222
    }

    main {
        position: relative;
        z-index: 1;
        background-color: #ddd
    }

    .yokoso {
        margin: 0;
        padding: 20vh 5vw 0 5vw;
        z-index: 700
    }

    .yokoso h1 {
        margin: 0;
        /* Flat approximation of fluid formula in _css/main.scss */
        font-size: 3.5rem;
    }

    .yokoso h2 {
        margin: 0;
        /* Flat approximation of fluid formula in _css/main.scss */
        font-size: 2.25rem;
    }

    .yokoso p {
        margin: 0;
        /* Keep in sync with .hero-lead's font-size ($fs-lead) in _css/main.scss - the only <p> that actually appears in a .yokoso hero today. */
        font-size: 1.5rem;
    }

    .yokoso .hsub {
        font-size: 1.5em
    }
</style>

<!--define CSS for loading window. Grid animation from Tobias Ahlin (https://github.com/tobiasahlin/SpinKit)-->
<style type="text/css">
    .UIload {
        margin-bottom: -100vh;
        position: fixed;
        height: 100vh;
        width: 100vw;
        z-index: 999;
        background-color: white;
        transform-origin: left;
        transition: visibility, transform 200ms ease;
        /* timing controlled by script */
    }

    .loading-grid {
        padding: calc((100vh - 40px) / 2) calc((100vw - 40px) / 2);
        height: 40px;
        width: 40px;
    }

    .loading-cube {
        height: 33%;
        width: 33%;
        background-color: navy;
        float: left;
        animation: UIloadAnime 1.3s infinite ease-in-out;
    }

    @keyframes UIloadAnime {

        0%,
        70%,
        100% {
            transform: scale3D(0.95, 0.95, 0.95)
        }

        35% {
            transform: scale3D(0, 0, 1);
        }
    }
</style>

<!--if JavaScript is allowed, asynchronously load rest of CSS + QoL scripts-->
<link rel="preload" as="style" href="{{ pathCss | url }}" onload="this.onload=null; this.rel='stylesheet'">

<!--if JavaScript is disabled, omit loading screen + fetch the CSS file-->
<noscript>
    <style type="text/css">
        .JSonly,
        .UIload {
            display: none
        }
    </style>
    <link rel="stylesheet" type="text/css" href="{{ pathCss | url }}" />
</noscript>
